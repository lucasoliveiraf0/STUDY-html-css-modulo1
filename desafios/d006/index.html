<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li title="Use a tag &lt;p&gt;">Parágrafo</li>
        <li title="Use a tag &lt;h1&gt;">Título de nível 1</li>
        <li title="Use a tag &lt;ul&gt;">Lista não ordenada</li>
        <li title="Use a tag &lt;ol&gt;">Lista ordenada</li>
        <li title="Use a tag &lt;a&gt;">Link</li>
        <li title="Use a tag &lt;img&gt;">Imagem</li>
        <li title="Use a tag &lt;video&gt;">Vídeo</li>
    </ul>
</body>
</html>
